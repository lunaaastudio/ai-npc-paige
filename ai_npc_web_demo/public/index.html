<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paige · 便利贴猫</title>
  <link rel="stylesheet" href="/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="shell">
    <section class="world" id="world">
      <div class="noise"></div>
      <div class="brand"><span class="sigil">✦</span> Paige的便利贴</div>
      <div class="model-wrap" id="modelWrap">
        <div class="loader" id="loader"><div class="orb"></div><span>召唤角色中…</span><small id="loadDetail">载入 3D 模型</small></div>
      </div>
      <div class="scene-bubble hidden" id="sceneBubble">
        <img class="sb-avatar" id="sbAvatar" src="/stickers/t-greet.png" alt="">
        <div class="sb-name">✦ PAIGE</div>
        <p class="sb-text" id="sbText"></p>
        <span class="sb-deco sb-moon">☾</span>
        <span class="sb-deco sb-spark1">✦</span>
        <span class="sb-deco sb-spark2">✧</span>
      </div>
      <div class="notes-layer" id="notesLayer"></div>
      <div class="board-legend">
        <span class="lg lg-donow">🔥 先做</span><span class="lg lg-plan">🌱 计划</span><span class="lg lg-quick">⚡ 速办</span><span class="lg lg-someday">☁️ 改天</span>
        <button id="clearBoard" class="clear-btn" title="清空全部便签">清空</button>
      </div>

      <form class="composer" id="composer">
        <button type="button" class="mic" id="mic" title="语音输入">🐾</button>
        <textarea id="input" rows="1" placeholder="对 Paige 说说最近的事…" maxlength="2000"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send">➤</button>
      </form>
      <div class="footer-line"><span id="modeText">本地模式</span><span>ENTER 发送 · SHIFT+ENTER 换行</span></div>

      <!-- 聊天记录保留但不可见（场景气泡已承担回复展示） -->
      <div class="messages" id="messages" hidden></div>
    </section>
  </main>

  <!-- 油画风格化滤镜：湍流位移模拟笔触 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="oilPaint" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.017" numOctaves="2" seed="7" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="13" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <script type="module" src="/app.js"></script>
</body>
</html>
