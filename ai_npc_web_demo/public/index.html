<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paige · AI NPC</title>
  <link rel="stylesheet" href="/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="shell">
    <section class="world" id="world">
      <div class="noise"></div>
      <div class="model-wrap" id="modelWrap">
        <div class="loader" id="loader"><div class="orb"></div><span>召唤角色中…</span><small id="loadDetail">载入 3D 模型</small></div>
      </div>
      <div class="scene-bubble hidden" id="sceneBubble">
        <img class="sb-avatar" id="sbAvatar" src="/stickers/t-greet.png" alt="">
        <div class="sb-name">✦ PAIGE</div>
        <p class="sb-text" id="sbText"></p>
        <span class="sb-deco sb-moon">☾</span>
        <span class="sb-deco sb-spark1">✦</span>
        <span class="sb-deco sb-spark2">✧</span>
      </div>
    </section>

    <section class="dialogue">
      <header class="dialogue-head">
        <div class="head-id">
          <img class="head-avatar" src="/stickers/t-happy.png" alt="">
          <div>
            <span class="eyebrow">LIVE CONVERSATION</span>
            <h2>和 Paige 说话</h2>
            <p class="head-sub">在这里，慢慢说就好。</p>
          </div>
        </div>
        <div class="presence-wrap">
          <button id="ttsToggle" class="icon-btn tts-btn" title="语音开关" aria-label="Toggle speech">🔊</button>
          <div class="presence"><span></span> 在线</div>
        </div>
      </header>

      <div class="messages" id="messages" aria-live="polite">
        <article class="msg npc">
          <div class="avatar"><img class="avatar-img" src="/stickers/t-greet.png" alt=""></div>
          <div><span class="speaker">PAIGE</span><p>你终于来了。这里的地图不会告诉所有人同一条路——它更喜欢先观察旅人。<br>今天，你想找一个地方，还是想找一个答案？</p></div>
        </article>
      </div>

      <div class="suggestions" id="suggestions">
        <button>你是谁？</button><button>这里是什么地方？</button><button>给我一个任务</button>
      </div>

      <form class="composer" id="composer">
        <button type="button" class="mic" id="mic" title="语音输入">⌁</button>
        <textarea id="input" rows="1" placeholder="对 Paige 说点什么…" maxlength="2000"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send">➜</button>
      </form>
      <div class="footer-line"><span id="modeText">DEMO MODE</span><span>ENTER 发送 · SHIFT+ENTER 换行</span></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
